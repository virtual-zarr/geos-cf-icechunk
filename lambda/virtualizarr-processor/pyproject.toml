[project]
name = "virtualizarr-processor"
version = "0.1.0"
description = "Module for ingesting geos-cf data to Icechunk"
requires-python = ">=3.11"
dependencies = [
    "icechunk",
    "pandera[xarray]>=0.25.0",
    "virtualizarr",
    "aiohttp",
    "h5py",
    "tenacity",
    "zarr",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["virtualizarr_processor"]
